[project]
name = "miners-monitoring"
version = "0.1.0"
description = "Self-hostable python app to monitor AxeOS local network miners"
readme = "README.md"
authors = [
    { name = "emchfk", email = "322185442+emchfk@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "platformdirs>=4.11.8",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "tomli>=2.4.1",
    "tomli-w>=1.2.0",
]

[project.scripts]
miners-monitoring = "miners_monitoring:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
